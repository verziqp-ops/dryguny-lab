name: Build NEXUS Android

on:
  push:
    branches: [ "nexus-ai-build" ]
    paths:
      - "nexus-android/**"
      - ".github/workflows/build-nexus.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build release APK
        working-directory: nexus-android
        run: gradle :app:assembleRelease --stacktrace

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4             nexus-android/app/build/outputs/apk/release/app-release-unsigned.apk             NexusAI-v0.9-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ./apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: NexusAI-v0.9-release-tools
          path: |
            NexusAI-v0.9-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error
